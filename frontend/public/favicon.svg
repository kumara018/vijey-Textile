<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Rose pink gradient background — matching logo palette -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fda4af"/>
      <stop offset="50%"  stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <!-- White shimmer for details -->
    <linearGradient id="wh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>

  <!-- ── CROWN ── -->
  <!-- Crown base bar -->
  <rect x="58" y="72" width="84" height="8" rx="2" fill="url(#wh)"/>
  <!-- Crown left spike -->
  <polygon points="62,72 68,48 76,72" fill="url(#wh)"/>
  <!-- Crown centre spike (tallest) -->
  <polygon points="92,72 100,38 108,72" fill="url(#wh)"/>
  <!-- Crown right spike -->
  <polygon points="124,72 132,48 138,72" fill="url(#wh)"/>
  <!-- Crown gems -->
  <circle cx="68"  cy="48" r="5" fill="#fecdd3"/>
  <circle cx="68"  cy="48" r="2" fill="#ffffff"/>
  <circle cx="100" cy="38" r="6" fill="#fecdd3"/>
  <circle cx="100" cy="38" r="2.5" fill="#ffffff"/>
  <circle cx="132" cy="48" r="5" fill="#fecdd3"/>
  <circle cx="132" cy="48" r="2" fill="#ffffff"/>

  <!-- ── DRESS (hanger + gown) ── -->
  <!-- Hanger hook -->
  <path d="M 100,82 Q 100,76 106,73 Q 112,70 112,76"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hanger bar -->
  <line x1="72" y1="82" x2="128" y2="82"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Dress bodice -->
  <path d="M 84,82 L 80,104 L 120,104 L 116,82 Z"
        fill="url(#wh)" opacity="0.9"/>
  <!-- Bow at waist -->
  <ellipse cx="100" cy="104" rx="10" ry="4" fill="#fecdd3" opacity="0.8"/>
  <circle  cx="100" cy="104" r="3"   fill="#ffffff"/>
  <!-- Dress skirt (flared) -->
  <path d="M 78,104 Q 60,130 58,152 Q 100,160 142,152 Q 140,130 122,104 Z"
        fill="url(#wh)" opacity="0.85"/>
  <!-- Skirt lace hem detail -->
  <path d="M 60,150 Q 100,158 140,150"
        fill="none" stroke="#fecdd3" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <!-- Small floral dots on skirt -->
  <circle cx="82"  cy="138" r="2.5" fill="#fecdd3" opacity="0.7"/>
  <circle cx="100" cy="142" r="2.5" fill="#fecdd3" opacity="0.7"/>
  <circle cx="118" cy="138" r="2.5" fill="#fecdd3" opacity="0.7"/>
</svg>
