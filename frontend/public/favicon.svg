<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rosebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#94a3b8"/>
      <stop offset="50%"  stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Rose circular background -->
  <circle cx="100" cy="100" r="98" fill="url(#rosebg)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#silver)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#silver)" stroke-width="0.6" opacity="0.3"/>

  <!-- Crown -->
  <path d="M52,95 L52,84 L62,84 L68,64 L76,84 L90,84 L100,52 L110,84 L124,84 L132,64 L138,84 L148,84 L148,95 Z"
        fill="none" stroke="url(#silver)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Crown gems — silver outer, white center -->
  <circle cx="100" cy="52" r="6"   fill="url(#silver)"/>
  <circle cx="100" cy="52" r="2.8" fill="#ffffff"/>
  <circle cx="68"  cy="64" r="4.5" fill="url(#silver)"/>
  <circle cx="68"  cy="64" r="2"   fill="#ffffff"/>
  <circle cx="132" cy="64" r="4.5" fill="url(#silver)"/>
  <circle cx="132" cy="64" r="2"   fill="#ffffff"/>

  <!-- VIJEY TEXTILE text -->
  <text x="100" y="148"
        text-anchor="middle"
        font-family="Palatino Linotype, Palatino, Georgia, serif"
        font-size="13" font-weight="bold"
        fill="url(#silver)" letter-spacing="1.5">VIJEY TEXTILE</text>
</svg>
