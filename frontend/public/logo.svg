<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" width="380" height="88">
  <defs>
    <!-- Feather barbs: teal → deep blue -->
    <linearGradient id="bL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d9488"/>
      <stop offset="60%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d9488"/>
      <stop offset="60%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Shaft: gold shimmer -->
    <linearGradient id="shaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b45309"/>
      <stop offset="50%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Brand text: rose gradient -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <!-- Silver divider -->
    <linearGradient id="div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#94a3b8"/>
      <stop offset="75%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ════ PEACOCK FEATHER ════ -->

  <!-- WISPY OUTER BARBS (thin strands beyond main plume) -->
  <!-- Left outer wisps -->
  <path d="M 53,32 C 34,42 14,58  8,76" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 53,38 C 36,50 20,65 16,80" fill="none" stroke="#0d9488" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M 53,26 C 30,32 12,42  6,58" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <!-- Right outer wisps -->
  <path d="M 57,32 C 76,42 96,58 102,76" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 57,38 C 74,50 90,65  94,80" fill="none" stroke="#0d9488" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M 57,26 C 80,32 98,42 104,58" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

  <!-- MAIN LEFT PLUME (filled fan shape) -->
  <path d="M 53,30 C 40,40 26,56 20,74 C 30,82 42,84 53,82 Z"
        fill="url(#bL)" opacity="0.82"/>
  <!-- Left plume inner barb lines -->
  <path d="M 53,30 C 44,42 36,58 32,74" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <path d="M 53,36 C 46,48 40,62 38,76" fill="none" stroke="#a5f3fc" stroke-width="0.6" opacity="0.4" stroke-linecap="round"/>
  <path d="M 53,44 C 47,54 44,66 43,78" fill="none" stroke="#ffffff"  stroke-width="0.5" opacity="0.35" stroke-linecap="round"/>

  <!-- MAIN RIGHT PLUME (mirror) -->
  <path d="M 57,30 C 70,40 84,56 90,74 C 80,82 68,84 57,82 Z"
        fill="url(#bR)" opacity="0.82"/>
  <!-- Right plume inner barb lines -->
  <path d="M 57,30 C 66,42 74,58 78,74" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <path d="M 57,36 C 64,48 70,62 72,76" fill="none" stroke="#a5f3fc" stroke-width="0.6" opacity="0.4" stroke-linecap="round"/>
  <path d="M 57,44 C 63,54 66,66 67,78" fill="none" stroke="#ffffff"  stroke-width="0.5" opacity="0.35" stroke-linecap="round"/>

  <!-- SHAFT (gold, centre spine) -->
  <line x1="55" y1="25" x2="55" y2="85"
        stroke="url(#shaft)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ══ FEATHER EYE (stacked concentric ovals) ══ -->
  <!-- Outermost: deep navy blue -->
  <ellipse cx="55" cy="23" rx="20" ry="23" fill="#1e3a8a"/>
  <!-- Dark teal ring -->
  <ellipse cx="55" cy="23" rx="14.5" ry="17" fill="#0f766e"/>
  <!-- Bright teal ring -->
  <ellipse cx="55" cy="23" rx="9.5"  ry="11.5" fill="#2dd4bf"/>
  <!-- Deep teal ring -->
  <ellipse cx="55" cy="23" rx="6"    ry="7.5"  fill="#0d9488"/>
  <!-- Rose gem centre -->
  <ellipse cx="55" cy="23" rx="3.2"  ry="4"    fill="#f43f5e"/>
  <!-- White highlight -->
  <circle  cx="53" cy="20.5" r="1.4" fill="#ffffff" opacity="0.8"/>

  <!-- ════ BRAND TEXT ════ -->

  <!-- VIJEY TEXTILE — rose serif -->
  <text x="130" y="37"
        font-family="Palatino Linotype, Palatino, Georgia, serif"
        font-size="23" font-weight="bold"
        fill="url(#brand)" letter-spacing="2.5">VIJEY TEXTILE</text>

  <!-- Silver shimmer divider -->
  <rect x="130" y="43" width="240" height="0.8" fill="url(#div)"/>

  <!-- Tagline -->
  <text x="131" y="56"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8.2" fill="#94a3b8" letter-spacing="2.6">LUXURY GIRLS' &amp; BABY FASHION</text>

  <!-- Location -->
  <text x="131" y="68"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7.5" fill="#cbd5e1" letter-spacing="1.8">TEXVALLEY GANGAPURAM · ERODE</text>
</svg>
