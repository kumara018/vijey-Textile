<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <!-- Silver shimmer gradient -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#94a3b8"/>
      <stop offset="35%"  stop-color="#e2e8f0"/>
      <stop offset="65%"  stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Rose gradient for brand name -->
    <linearGradient id="rose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <!-- Soft background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="300" fill="url(#bg)" rx="4"/>

  <!-- CROWN EMBLEM -->
  <path d="M256,104 L256,90 L272,90 L280,65 L290,90 L316,90 L340,46 L364,90 L390,90 L400,65 L408,90 L424,90 L424,104 Z"
        fill="#fff1f2" stroke="url(#silver)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="256" y1="98" x2="424" y2="98" stroke="url(#silver)" stroke-width="1" opacity="0.5"/>

  <!-- Crown peak gems — silver outer, rose inner -->
  <circle cx="280" cy="65" r="6"   fill="url(#silver)"/>
  <circle cx="280" cy="65" r="3"   fill="#e11d48"/>
  <circle cx="340" cy="46" r="8"   fill="url(#silver)"/>
  <circle cx="340" cy="46" r="4"   fill="#e11d48"/>
  <circle cx="400" cy="65" r="6"   fill="url(#silver)"/>
  <circle cx="400" cy="65" r="3"   fill="#e11d48"/>

  <!-- Diamond ornaments at base corners -->
  <polygon points="248,104 256,112 264,104 256,96" fill="url(#silver)" opacity="0.8"/>
  <polygon points="416,104 424,112 432,104 424,96" fill="url(#silver)" opacity="0.8"/>

  <!-- Three dots along crown base -->
  <circle cx="310" cy="97" r="2.2" fill="url(#silver)" opacity="0.7"/>
  <circle cx="340" cy="97" r="2.2" fill="url(#silver)" opacity="0.7"/>
  <circle cx="370" cy="97" r="2.2" fill="url(#silver)" opacity="0.7"/>

  <!-- BRAND NAME shadow -->
  <text x="342" y="176" text-anchor="middle"
        font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
        font-size="54" font-weight="bold"
        fill="#fda4af" letter-spacing="4" opacity="0.3">VIJEY TEXTILE</text>
  <!-- BRAND NAME main -->
  <text x="340" y="174" text-anchor="middle"
        font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
        font-size="54" font-weight="bold"
        fill="url(#rose)" letter-spacing="4">VIJEY TEXTILE</text>

  <!-- DECORATIVE RULE -->
  <line x1="80"  y1="194" x2="296" y2="194" stroke="url(#silver)" stroke-width="1.2"/>
  <polygon points="340,186 348,194 340,202 332,194" fill="url(#silver)"/>
  <circle cx="318" cy="194" r="2.5" fill="url(#silver)" opacity="0.7"/>
  <circle cx="362" cy="194" r="2.5" fill="url(#silver)" opacity="0.7"/>
  <line x1="384" y1="194" x2="600" y2="194" stroke="url(#silver)" stroke-width="1.2"/>

  <!-- TAGLINE -->
  <text x="340" y="224" text-anchor="middle"
        font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
        font-size="14" fill="#64748b" letter-spacing="6">LUXURY GIRLS&#39; &amp; BABY FASHION</text>

  <!-- LOCATION BYLINE -->
  <line x1="175" y1="249" x2="250" y2="249" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="252" text-anchor="middle"
        font-family="Georgia, Times New Roman, serif"
        font-size="10.5" fill="#94a3b8" letter-spacing="3.5">TEXVALLEY GANGAPURAM  ·  ERODE</text>
  <line x1="430" y1="249" x2="505" y2="249" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- BORDER FRAME -->
  <rect x="12" y="12" width="656" height="276"
        fill="none" stroke="url(#silver)" stroke-width="1.5" rx="3" opacity="0.4"/>
  <rect x="18" y="18" width="644" height="264"
        fill="none" stroke="url(#silver)" stroke-width="0.6" rx="2" opacity="0.25"/>

  <!-- Corner ornaments -->
  <polygon points="12,24 20,12 28,24 20,36"   fill="url(#silver)" opacity="0.6"/>
  <polygon points="652,24 660,12 668,24 660,36" fill="url(#silver)" opacity="0.6"/>
  <polygon points="12,276 20,264 28,276 20,288" fill="url(#silver)" opacity="0.6"/>
  <polygon points="652,276 660,264 668,276 660,288" fill="url(#silver)" opacity="0.6"/>
</svg>
