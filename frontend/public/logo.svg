<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 92" width="320" height="92">
  <defs>
    <!-- Upper wing: radial — white centre, rose edges (light-through-dupatta effect) -->
    <radialGradient id="uwL" cx="36%" cy="40%" r="68%">
      <stop offset="0%"   stop-color="#fff1f2"/>
      <stop offset="40%"  stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <radialGradient id="uwR" cx="64%" cy="40%" r="68%">
      <stop offset="0%"   stop-color="#fff1f2"/>
      <stop offset="40%"  stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <!-- Lower wing: deeper rose -->
    <radialGradient id="lwL" cx="33%" cy="58%" r="62%">
      <stop offset="0%"   stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="lwR" cx="67%" cy="58%" r="62%">
      <stop offset="0%"   stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <!-- Body: silver shimmer -->
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cbd5e1"/>
      <stop offset="50%"  stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Brand text -->
    <linearGradient id="brandG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <!-- Silver divider line -->
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fecdd3" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#94a3b8"/>
      <stop offset="75%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ════ BUTTERFLY ════ -->

  <!-- UPPER LEFT WING — flowing dupatta curve -->
  <path d="M 63,43 C 50,14 10,0 4,22 C -1,43 26,64 63,57 Z"
        fill="url(#uwL)" opacity="0.96"/>
  <!-- Dupatta fabric fold lines -->
  <path d="M 63,43 C 46,24 26,13 12,24"
        fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M 63,43 C 52,30 38,20 24,27"
        fill="none" stroke="#fecdd3" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Wing tip jewel -->
  <circle cx="5" cy="23"  r="2.4" fill="#fda4af" opacity="0.85"/>
  <circle cx="5" cy="23"  r="1"   fill="#ffffff"  opacity="0.9"/>

  <!-- UPPER RIGHT WING — mirror -->
  <path d="M 71,43 C 84,14 124,0 130,22 C 135,43 108,64 71,57 Z"
        fill="url(#uwR)" opacity="0.96"/>
  <path d="M 71,43 C 88,24 108,13 122,24"
        fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M 71,43 C 82,30 96,20 110,27"
        fill="none" stroke="#fecdd3" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="129" cy="23" r="2.4" fill="#fda4af" opacity="0.85"/>
  <circle cx="129" cy="23" r="1"   fill="#ffffff"  opacity="0.9"/>

  <!-- LOWER LEFT WING — smaller, rounded -->
  <path d="M 63,57 C 44,64 20,76 22,87 C 33,97 60,87 67,70 Z"
        fill="url(#lwL)" opacity="0.88"/>
  <!-- Lower wing fold -->
  <path d="M 63,57 C 46,65 32,73 33,83"
        fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <!-- Lower tip jewel -->
  <circle cx="22" cy="87" r="1.8" fill="#fecdd3" opacity="0.7"/>

  <!-- LOWER RIGHT WING — mirror -->
  <path d="M 71,57 C 90,64 114,76 112,87 C 101,97 74,87 67,70 Z"
        fill="url(#lwR)" opacity="0.88"/>
  <path d="M 71,57 C 88,65 102,73 101,83"
        fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <circle cx="112" cy="87" r="1.8" fill="#fecdd3" opacity="0.7"/>

  <!-- BODY — silver tapered elegant shape -->
  <ellipse cx="67" cy="56" rx="3.2" ry="21" fill="url(#bodyG)"/>
  <!-- Head -->
  <circle cx="67" cy="33"  r="5"   fill="url(#bodyG)"/>
  <!-- Head gem -->
  <circle cx="67" cy="33"  r="2.2" fill="#f43f5e"/>
  <circle cx="67" cy="33"  r="0.9" fill="#ffffff"/>

  <!-- ANTENNAE — curved silver with pink tips -->
  <path d="M 65,29 Q 55,18 49,8"
        stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="49" cy="8"  r="2.8" fill="#fda4af" stroke="#94a3b8" stroke-width="0.7"/>
  <circle cx="49" cy="8"  r="1.1" fill="#ffffff"/>

  <path d="M 69,29 Q 79,18 85,8"
        stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="85" cy="8"  r="2.8" fill="#fda4af" stroke="#94a3b8" stroke-width="0.7"/>
  <circle cx="85" cy="8"  r="1.1" fill="#ffffff"/>

  <!-- ════ BRAND TEXT ════ -->

  <!-- VIJEY TEXTILE — rose gradient, serif -->
  <text x="152" y="44"
        font-family="Palatino Linotype, Palatino, Georgia, serif"
        font-size="23" font-weight="bold"
        fill="url(#brandG)" letter-spacing="2.5">VIJEY TEXTILE</text>

  <!-- Silver shimmer divider -->
  <rect x="152" y="50" width="160" height="0.8" fill="url(#divLine)"/>

  <!-- Tagline — silver -->
  <text x="153" y="62"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8" fill="#94a3b8" letter-spacing="2.8">LUXURY GIRLS' &amp; BABY FASHION</text>

  <!-- Location -->
  <text x="153" y="74"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7.5" fill="#cbd5e1" letter-spacing="1.8">TEXVALLEY GANGAPURAM · ERODE</text>
</svg>
